[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mdtool"
version = "0.1.0"
description = "Markdown-Dateien und Ordner im Terminal verwalten"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["textual>=8.0,<9", "send2trash>=1.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mdtool = "mdtool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
